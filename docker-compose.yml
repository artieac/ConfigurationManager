# Builds and runs the backend and frontend. Assumes a MySQL instance already
# exists elsewhere (see database/README.md) — this file does not manage one.
#
# All secrets/config come from a gitignored .env file next to this one
# (docker compose loads it automatically) — copy .env.example to .env and
# fill it in. This compose file itself has nothing sensitive in it and is
# safe to commit.
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SM_SERVER_PORT:-8089}:${SM_SERVER_PORT:-8089}"
    networks:
      - nginx-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    networks:
      - nginx-network
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"

networks:
  nginx-network:
    external: true